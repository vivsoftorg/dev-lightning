services:
  app-wrangler:
    image: dev-lightning:wrangler
    container_name: bolt-diy
    build:
      context: .
      dockerfile: Dockerfile
      target: wrangler
    ports:
      - "5173:5173"
    env_file:
      - ".env"
    environment:
      - NODE_ENV=production
      - PORT=5173
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-debug}
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}
      - RUNNING_IN_DOCKER=true
      - VITE_BASE_PATH=${VITE_BASE_PATH}
      - VITE_PUBLIC_APP_URL=${VITE_PUBLIC_APP_URL}
      - VITE_SERVER_ALLOWED_HOSTS=${VITE_SERVER_ALLOWED_HOSTS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: pnpm run dockerstart
    profiles:
      - wrangler

  app-dev:
    image: dev-lightning:development
    container_name: bolt-diy-dev
    build:
      target: development
    env_file:
      - ".env"
    environment:
      - NODE_ENV=development
      - VITE_HMR_PROTOCOL=ws
      - VITE_HMR_HOST=localhost
      - VITE_HMR_PORT=5173
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - PORT=5173
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-debug}
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}
      - RUNNING_IN_DOCKER=true
      - VITE_BASE_PATH=${VITE_BASE_PATH}
      - VITE_PUBLIC_APP_URL=${VITE_PUBLIC_APP_URL}
      - VITE_SERVER_ALLOWED_HOSTS=${VITE_SERVER_ALLOWED_HOSTS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: .
        target: /app
        consistency: cached
      - /app/node_modules
    ports:
      - "5173:5173"
    command: pnpm run dev --host 0.0.0.0
    profiles: ["development", "default"]
    depends_on:
      - nginx

  app-prod:
    image: dev-lightning:production
    container_name: bolt-diy-prod
    build:
      target: production
    env_file:
      - ".env"
    environment:
      - NODE_ENV=production
      - VITE_HMR_PROTOCOL=ws
      - VITE_HMR_HOST=localhost
      - VITE_HMR_PORT=5173
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - PORT=5173
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-debug}
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}
      - RUNNING_IN_DOCKER=true
      - VITE_BASE_PATH=${VITE_BASE_PATH}
      - VITE_PUBLIC_APP_URL=${VITE_PUBLIC_APP_URL}
      - VITE_SERVER_ALLOWED_HOSTS=${VITE_SERVER_ALLOWED_HOSTS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: .
        target: /app
        consistency: cached
      - /app/node_modules
    ports:
      - "5173:5173"
    command: pnpm run dev --host 0.0.0.0
    profiles: ["production", "default"]
    depends_on:
      - nginx
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    profiles: ["development", "production", "default"]

  app-prebuild:
    image: ghcr.io/vivsoftorg/dev-lightning:v1.0.0
    container_name: bolt-diy
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - COMPOSE_PROFILES=production
      # No strictly needed but serving as hints for Coolify
      - PORT=5173
      - OLLAMA_API_BASE_URL=http://127.0.0.1:11434
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}
      - RUNNING_IN_DOCKER=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: pnpm run dockerstart
    profiles:
      - prebuilt
